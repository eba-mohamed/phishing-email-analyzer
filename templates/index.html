<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Email Analyzer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; color:#e0e0e0; font-family:'Courier New',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .container { width:100%; max-width:800px; padding:40px 24px; }
  .header { text-align:center; margin-bottom:40px; }
  .tag { color:#ff6b6b; font-size:13px; letter-spacing:4px; margin-bottom:12px; }
  h1 { font-size:clamp(28px,5vw,46px); font-weight:900; letter-spacing:2px; color:#fff; }
  .subtitle { color:#888; font-size:13px; letter-spacing:3px; margin-top:8px; }
  .card { background:#111118; border:1px solid #1e1e2e; padding:32px; position:relative; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,#ff6b6b,#ffa94d); }
  .tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid #1e1e2e; }
  .tab { padding:10px 24px; cursor:pointer; font-size:12px; letter-spacing:2px; color:#666; border-bottom:2px solid transparent; transition:all .2s; background:none; border-left:none; border-right:none; border-top:none; font-family:'Courier New',monospace; }
  .tab.active { color:#ff6b6b; border-bottom:2px solid #ff6b6b; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  label { display:block; font-size:11px; letter-spacing:2px; color:#ff6b6b; margin-bottom:8px; }
  .upload-area { border:2px dashed #2a2a3e; padding:40px; text-align:center; cursor:pointer; transition:border-color .2s; margin-bottom:20px; }
  .upload-area:hover, .upload-area.dragover { border-color:#ff6b6b; }
  .upload-area p { color:#555; font-size:13px; }
  .upload-area .icon { font-size:36px; margin-bottom:12px; }
  input[type=file] { display:none; }
  textarea { width:100%; background:#0a0a0f; border:1px solid #2a2a3e; color:#e0e0e0; font-family:'Courier New',monospace; font-size:12px; padding:16px; resize:vertical; min-height:200px; outline:none; transition:border-color .2s; }
  textarea:focus { border-color:#ff6b6b; }
  .btn { width:100%; padding:16px; background:#ff6b6b; color:#fff; border:none; font-family:'Courier New',monospace; font-size:13px; letter-spacing:3px; cursor:pointer; font-weight:700; transition:background .2s; margin-top:16px; }
  .btn:hover { background:#ff5252; }
  .btn:disabled { background:#333; cursor:not-allowed; color:#666; }
  .terminal { background:#050508; border:1px solid #1e1e2e; padding:16px; font-size:12px; display:none; margin-top:20px; min-height:80px; }
  .terminal .line { color:#ff6b6b; margin-bottom:4px; }
  .progress-bar { height:2px; background:#1e1e2e; margin-top:12px; }
  .progress-fill { height:100%; background:#ff6b6b; width:0%; transition:width .4s; }
  .result-btn { width:100%; padding:16px; background:#ff6b6b; color:#fff; border:none; font-family:'Courier New',monospace; font-size:13px; letter-spacing:3px; cursor:pointer; font-weight:700; display:none; margin-top:12px; text-decoration:none; text-align:center; }
  .nav { display:flex; gap:32px; justify-content:center; margin-top:32px; }
  .nav a { color:#555; font-size:11px; letter-spacing:2px; text-decoration:none; }
  .nav a:hover { color:#ff6b6b; }
  .vt-badge { display:inline-block; background:#1e1e2e; color:#ffa94d; font-size:10px; letter-spacing:1px; padding:3px 10px; margin-bottom:20px; }
  .selected-file { color:#ff6b6b; font-size:12px; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="tag">[ SECURITY TOOL v1.0 ]</div>
    <h1>PHISHING ANALYZER</h1>
    <div class="subtitle">EMAIL FORENSICS + THREAT DETECTION + CVE REPORT</div>
  </div>

  {% if vt_configured %}
  <div style="text-align:center;margin-bottom:16px">
    <span class="vt-badge">✓ VIRUSTOTAL INTEGRATED</span>
  </div>
  {% endif %}

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('upload')">UPLOAD .EML FILE</button>
      <button class="tab" onclick="switchTab('paste')">PASTE RAW EMAIL</button>
    </div>

    <!-- Upload tab -->
    <div class="tab-content active" id="tab-upload">
      <div class="upload-area" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📧</div>
        <p>Drop your .eml file here or click to browse</p>
        <input type="file" id="fileInput" accept=".eml,.txt" onchange="fileSelected(this)">
      </div>
      <div class="selected-file" id="selectedFile"></div>
      <button class="btn" id="scanBtnFile" onclick="startScan('file')" disabled>ANALYZE EMAIL</button>
    </div>

    <!-- Paste tab -->
    <div class="tab-content" id="tab-paste">
      <label>PASTE RAW EMAIL HEADERS + BODY</label>
      <textarea id="rawEmail" placeholder="Paste the full raw email content here including headers...&#10;&#10;Example:&#10;From: attacker@evil.com&#10;To: victim@company.com&#10;Subject: Urgent: Verify your account&#10;&#10;Dear Customer, your account has been suspended..."></textarea>
      <button class="btn" id="scanBtnPaste" onclick="startScan('paste')">ANALYZE EMAIL</button>
    </div>

    <!-- Terminal output -->
    <div class="terminal" id="terminal">
      <div id="termLines"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <a class="result-btn" id="resultBtn" href="#">VIEW FULL REPORT</a>
  </div>

  <div class="nav">
    <a href="/history">SCAN HISTORY</a>
  </div>
</div>

<script>
let currentScanId = null;
let pollInterval = null;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='upload'&&i===0)||(tab==='paste'&&i===1)));
  document.getElementById('tab-upload').classList.toggle('active', tab==='upload');
  document.getElementById('tab-paste').classList.toggle('active', tab==='paste');
}

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) { document.getElementById('fileInput').files = e.dataTransfer.files; fileSelected({files:[file]}); }
});

function fileSelected(input) {
  const file = input.files[0];
  if (file) {
    document.getElementById('selectedFile').textContent = '📎 ' + file.name;
    document.getElementById('scanBtnFile').disabled = false;
  }
}

function log(msg) {
  const div = document.createElement('div');
  div.className = 'line';
  div.textContent = '>> ' + msg;
  document.getElementById('termLines').appendChild(div);
}

function setProgress(pct) {
  document.getElementById('progress').style.width = pct + '%';
}

async function startScan(mode) {
  document.getElementById('terminal').style.display = 'block';
  document.getElementById('termLines').innerHTML = '';
  document.getElementById('resultBtn').style.display = 'none';
  document.getElementById('scanBtnFile').disabled = true;
  document.getElementById('scanBtnPaste').disabled = true;
  setProgress(10);
  log('Starting analysis...');

  const formData = new FormData();
  if (mode === 'file') {
    formData.append('email_file', document.getElementById('fileInput').files[0]);
  } else {
    formData.append('raw_email', document.getElementById('rawEmail').value);
  }

  const resp = await fetch('/analyze', { method:'POST', body:formData });
  const data = await resp.json();
  if (data.error) { log('Error: ' + data.error); return; }

  currentScanId = data.scan_id;
  log('Scan started, ID: ' + currentScanId.substring(0,8) + '...');

  pollInterval = setInterval(() => pollStatus(currentScanId), 2000);
}

async function pollStatus(id) {
  const resp = await fetch('/status/' + id);
  const data = await resp.json();
  const status = data.status;

  if (status === 'parsing') { log('Parsing email headers and body...'); setProgress(30); }
  else if (status === 'analyzing') { log('Running heuristic threat detection...'); setProgress(55); }
  else if (status === 'virustotal') { log('Checking URLs against VirusTotal...'); setProgress(75); }
  else if (status === 'complete') {
    clearInterval(pollInterval);
    log('Analysis complete!');
    setProgress(100);
    document.getElementById('resultBtn').href = '/results/' + id;
    document.getElementById('resultBtn').style.display = 'block';
    document.getElementById('scanBtnFile').disabled = false;
    document.getElementById('scanBtnPaste').disabled = false;
  } else if (status.startsWith('error')) {
    clearInterval(pollInterval);
    log('Error: ' + status);
    document.getElementById('scanBtnFile').disabled = false;
    document.getElementById('scanBtnPaste').disabled = false;
  }
}
</script>
</body>
</html>
